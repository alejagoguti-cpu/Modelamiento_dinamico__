<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo 2: Red Territorial · RAPOT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px 30px;
      background: rgba(10, 14, 39, 0.8);
      border-bottom: 2px solid rgba(47, 212, 200, 0.2);
      z-index: 10;
    }

    .header h1 {
      font-size: 2em;
      color: #2fbfae;
      font-family: 'Space Grotesk', sans-serif;
      margin-bottom: 5px;
    }

    .header p {
      color: #cbd5e1;
      font-size: 0.95em;
    }

    .network-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at center, rgba(26, 31, 58, 0.8) 0%, rgba(10, 14, 39, 0.95) 100%);
    }

    .connection-line {
      stroke: rgba(180, 140, 50, 0.35);
      stroke-width: 1.5;
      fill: none;
      pointer-events: none;
    }

    .node-circle {
      fill-opacity: 0.9;
      stroke-width: 2.5;
      stroke: url(#grad-border);
      filter: drop-shadow(0 0 10px rgba(180, 140, 50, 0.4));
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .node-circle:hover {
      filter: drop-shadow(0 0 25px rgba(180, 140, 50, 0.8));
      stroke-width: 3.5;
    }

    .node-label {
      font-size: 11px;
      font-weight: 700;
      text-anchor: middle;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      fill: #fef3c7;
      letter-spacing: 0.5px;
    }

    .legend {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid rgba(180, 140, 50, 0.4);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
      z-index: 20;
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
      font-size: 0.9em;
      color: #e2e8f0;
    }

    .legend-item:last-child {
      margin-bottom: 0;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(180, 140, 50, 0.5);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid rgba(180, 140, 50, 0.4);
      border-radius: 16px;
      padding: 30px;
      max-width: 1000px;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: #b48c32;
      font-size: 32px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .modal-close:hover {
      transform: scale(1.2);
      color: #f59e0b;
    }

    .modal h2 {
      color: #b48c32;
      font-size: 1.8em;
      margin-bottom: 20px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .subsystems-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .subsystem-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(180, 140, 50, 0.2);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .subsystem-card:hover {
      border-color: rgba(180, 140, 50, 0.6);
      background: rgba(180, 140, 50, 0.1);
      transform: translateY(-4px);
    }

    .subsystem-card h3 {
      color: #b48c32;
      margin-bottom: 10px;
      font-size: 1em;
    }

    .subsystem-card p {
      color: #cbd5e1;
      font-size: 0.9em;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      background: rgba(180, 140, 50, 0.2);
      color: #b48c32;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8em;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🌐 La Red Territorial del POT</h1>
    <p>36 subsistemas únicos • Red estática distribuida • Conexiones reales del Decreto 555</p>
  </div>

  <div class="network-wrapper">
    <svg id="networkSvg" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="grad-eep" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2fbfae"></stop>
          <stop offset="100%" stop-color="#1f8f82"></stop>
        </linearGradient>
        <linearGradient id="grad-eip" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#d86ef5"></stop>
          <stop offset="100%" stop-color="#a855f7"></stop>
        </linearGradient>
        <linearGradient id="grad-efc" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f59e0b"></stop>
          <stop offset="100%" stop-color="#d97706"></stop>
        </linearGradient>
        <linearGradient id="grad-eseci" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3b82f6"></stop>
          <stop offset="100%" stop-color="#1e40af"></stop>
        </linearGradient>
        <linearGradient id="grad-border" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#b48c32"></stop>
          <stop offset="100%" stop-color="#d97706"></stop>
        </linearGradient>
      </defs>
      <g class="connections"></g>
      <g class="nodes"></g>
    </svg>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-color" style="background: linear-gradient(135deg, #2fbfae, #1f8f82);"></div>
        <div>EEP: Ecológica</div>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: linear-gradient(135deg, #d86ef5, #a855f7);"></div>
        <div>EIP: Patrimonios</div>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: linear-gradient(135deg, #f59e0b, #d97706);"></div>
        <div>EFC: Funcional</div>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: linear-gradient(135deg, #3b82f6, #1e40af);"></div>
        <div>ESECI: Socioeconómica</div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h2>36 Subsistemas Territoriales</h2>
    <div class="subsystems-grid" id="subsystemsGrid"></div>
  </div>
</div>

<script>
// 36 Subsistemas ESPECÍFICOS - SIN REDUNDANCIAS
const SUBSISTEMAS = [
  // EEP - Específicos (6)
  { nombre: "Río Bogotá", estructura: "EEP", conexiones: 6, gradient: "grad-eep", elementos: 1 },
  { nombre: "Jaboque", estructura: "EEP", conexiones: 5, gradient: "grad-eep", elementos: 1 },
  { nombre: "Cerros Orientales", estructura: "EEP", conexiones: 5, gradient: "grad-eep", elementos: 1 },
  { nombre: "Páramo Chingaza", estructura: "EEP", conexiones: 4, gradient: "grad-eep", elementos: 1 },
  { nombre: "Bosque Thomas van der Hammen", estructura: "EEP", conexiones: 4, gradient: "grad-eep", elementos: 1 },
  { nombre: "Conejera", estructura: "EEP", conexiones: 5, gradient: "grad-eep", elementos: 1 },

  // EIP - Específicos (4)
  { nombre: "Candelaria Centro Histórico", estructura: "EIP", conexiones: 5, gradient: "grad-eip", elementos: 1 },
  { nombre: "Tradiciones Muiscas", estructura: "EIP", conexiones: 4, gradient: "grad-eip", elementos: 1 },
  { nombre: "Monserrate Sagrado", estructura: "EIP", conexiones: 5, gradient: "grad-eip", elementos: 1 },
  { nombre: "Salto del Tequendama", estructura: "EIP", conexiones: 4, gradient: "grad-eip", elementos: 1 },

  // EFC - Específicos (14)
  { nombre: "Avenida Boyacá", estructura: "EFC", conexiones: 11, gradient: "grad-efc", elementos: 1 },
  { nombre: "Ciclovía Sabana", estructura: "EFC", conexiones: 10, gradient: "grad-efc", elementos: 1 },
  { nombre: "TransMilenio", estructura: "EFC", conexiones: 9, gradient: "grad-efc", elementos: 1 },
  { nombre: "Estaciones de Metro", estructura: "EFC", conexiones: 8, gradient: "grad-efc", elementos: 1 },
  { nombre: "Red Colegios", estructura: "EFC", conexiones: 9, gradient: "grad-efc", elementos: 1 },
  { nombre: "Hospitales Zona Centro", estructura: "EFC", conexiones: 9, gradient: "grad-efc", elementos: 1 },
  { nombre: "Biblioteca Luis Ángel Arango", estructura: "EFC", conexiones: 7, gradient: "grad-efc", elementos: 1 },
  { nombre: "Coliseo El Campín", estructura: "EFC", conexiones: 6, gradient: "grad-efc", elementos: 1 },
  { nombre: "Parque Metropolitano Simón Bolívar", estructura: "EFC", conexiones: 8, gradient: "grad-efc", elementos: 1 },
  { nombre: "Plaza Mayor", estructura: "EFC", conexiones: 8, gradient: "grad-efc", elementos: 1 },
  { nombre: "Acueducto de Bogotá", estructura: "EFC", conexiones: 5, gradient: "grad-efc", elementos: 1 },
  { nombre: "Red de Energía", estructura: "EFC", conexiones: 5, gradient: "grad-efc", elementos: 1 },
  { nombre: "Red de Telecom", estructura: "EFC", conexiones: 4, gradient: "grad-efc", elementos: 1 },
  { nombre: "Relleno Sanitario Doña Juana", estructura: "EFC", conexiones: 3, gradient: "grad-efc", elementos: 1 },

  // ESECI - Específicos (12)
  { nombre: "Centro Comercial Zona Centro", estructura: "ESECI", conexiones: 6, gradient: "grad-eseci", elementos: 1 },
  { nombre: "Paloquemao Mercado", estructura: "ESECI", conexiones: 5, gradient: "grad-eseci", elementos: 1 },
  { nombre: "Comercio Minorista Chapinero", estructura: "ESECI", conexiones: 7, gradient: "grad-eseci", elementos: 1 },
  { nombre: "Distrito Industrial Puente Aranda", estructura: "ESECI", conexiones: 4, gradient: "grad-eseci", elementos: 1 },
  { nombre: "Parque Tecnológico Yumbo", estructura: "ESECI", conexiones: 4, gradient: "grad-eseci", elementos: 1 },
  { nombre: "Centro de Convenciones", estructura: "ESECI", conexiones: 5, gradient: "grad-eseci", elementos: 1 },
  { nombre: "Vivienda Ciudad Kennedy", estructura: "ESECI", conexiones: 7, gradient: "grad-eseci", elementos: 1 },
  { nombre: "Vivienda Usaquén Medio", estructura: "ESECI", conexiones: 6, gradient: "grad-eseci", elementos: 1 },
  { nombre: "Vivienda Teusaquillo Premium", estructura: "ESECI", conexiones: 5, gradient: "grad-eseci", elementos: 1 },
  { nombre: "Alcaldía Mayor", estructura: "ESECI", conexiones: 4, gradient: "grad-eseci", elementos: 1 },
  { nombre: "Banco de la República", estructura: "ESECI", conexiones: 4, gradient: "grad-eseci", elementos: 1 },
  { nombre: "Universidad Nacional", estructura: "ESECI", conexiones: 5, gradient: "grad-eseci", elementos: 1 },
];

// Conexiones - SOLO reales
const CONEXIONES = [
  // EEP interno
  [0, 1], [0, 2], [0, 4],
  [1, 5],
  [2, 3],

  // EIP interno
  [6, 7], [6, 8],
  [7, 9],

  // EFC - movilidad base
  [10, 11], [10, 12], [10, 13],
  [11, 12], [11, 13],

  // EFC - equipamientos a movilidad
  [14, 10], [14, 11],
  [15, 10], [15, 11],
  [16, 10], [16, 11],
  [17, 10], [17, 11],

  // EFC - espacio público
  [18, 10], [18, 11],
  [19, 10], [19, 11],
  [20, 10],
  [21, 10],
  [22, 10],
  [23, 11],

  // EIP a EEP
  [6, 0], [6, 1], [6, 2],
  [8, 0], [8, 2],

  // ESECI a EFC
  [24, 10], [24, 11],
  [25, 10], [25, 11],
  [26, 10], [26, 11],
  [27, 10], [27, 12],
  [28, 10], [28, 11],
  [29, 10],
  [30, 10], [30, 12],
  [31, 10], [31, 12],
  [32, 10], [32, 11], [32, 18],
  [33, 10], [33, 11],
  [34, 10], [34, 11],
  [35, 10], [35, 16],
];

// Generar layout distribuido con buena separación
function generateLayout() {
  const positions = [];
  const positions_data = [
    // EEP - fila superior
    { x: 150, y: 120 },   // 0
    { x: 350, y: 80 },    // 1
    { x: 550, y: 100 },   // 2
    { x: 750, y: 70 },    // 3
    { x: 950, y: 100 },   // 4
    { x: 1150, y: 85 },   // 5

    // EIP
    { x: 1350, y: 180 },  // 6
    { x: 1480, y: 320 },  // 7
    { x: 1420, y: 480 },  // 8
    { x: 1300, y: 600 },  // 9

    // EFC - zona central derecha (grande)
    { x: 200, y: 350 },   // 10
    { x: 400, y: 300 },   // 11
    { x: 600, y: 280 },   // 12
    { x: 800, y: 300 },   // 13
    { x: 250, y: 550 },   // 14
    { x: 450, y: 600 },   // 15
    { x: 650, y: 620 },   // 16
    { x: 850, y: 610 },   // 17
    { x: 350, y: 800 },   // 18
    { x: 600, y: 850 },   // 19
    { x: 1000, y: 450 },  // 20
    { x: 1100, y: 600 },  // 21
    { x: 1200, y: 750 },  // 22
    { x: 1350, y: 850 },  // 23

    // ESECI - zona inferior izquierda
    { x: 100, y: 750 },   // 24
    { x: 250, y: 900 },   // 25
    { x: 450, y: 920 },   // 26
    { x: 1100, y: 800 },  // 27
    { x: 1250, y: 920 },  // 28
    { x: 150, y: 400 },   // 29
    { x: 900, y: 750 },   // 30
    { x: 1020, y: 900 },  // 31
    { x: 750, y: 450 },   // 32
    { x: 1400, y: 750 },  // 33
    { x: 1480, y: 850 },  // 34
    { x: 1520, y: 600 },  // 35
  ];

  positions_data.forEach((p, i) => {
    positions[i] = p;
  });

  return positions;
}

const positions = generateLayout();

// Renderizar
function render() {
  const svg = document.getElementById('networkSvg');
  const connectionsGroup = svg.querySelector('.connections');
  const nodesGroup = svg.querySelector('.nodes');

  connectionsGroup.innerHTML = '';
  nodesGroup.innerHTML = '';

  // Líneas
  CONEXIONES.forEach(([a, b]) => {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', positions[a].x);
    line.setAttribute('y1', positions[a].y);
    line.setAttribute('x2', positions[b].x);
    line.setAttribute('y2', positions[b].y);
    line.setAttribute('class', 'connection-line');
    connectionsGroup.appendChild(line);
  });

  // Nodos
  SUBSISTEMAS.forEach((s, i) => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('data-id', i);
    g.onclick = () => showModal();

    const radius = 28 + s.conexiones * 2.5;

    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', positions[i].x);
    circle.setAttribute('cy', positions[i].y);
    circle.setAttribute('r', radius);
    circle.setAttribute('fill', `url(#${s.gradient})`);
    circle.setAttribute('class', 'node-circle');
    g.appendChild(circle);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', positions[i].x);
    text.setAttribute('y', positions[i].y + 5);
    text.setAttribute('class', 'node-label');
    text.textContent = s.nombre.substring(0, 16);
    g.appendChild(text);

    nodesGroup.appendChild(g);
  });
}

render();

// Modal
function showModal() {
  const grid = document.getElementById('subsystemsGrid');
  grid.innerHTML = SUBSISTEMAS.map((s, i) => `
    <div class="subsystem-card">
      <h3>${s.nombre}</h3>
      <p>${s.estructura}</p>
      <span class="badge">${s.conexiones} conexiones</span>
    </div>
  `).join('');

  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});
</script>

</body>
</html>
